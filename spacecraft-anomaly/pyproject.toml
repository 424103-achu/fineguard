[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sad"
version = "0.1.0"
description = "Spacecraft telemetry anomaly detection with LSTMs (NASA SMAP / MSL)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "torch>=2.1",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
mlflow = ["mlflow>=2.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
